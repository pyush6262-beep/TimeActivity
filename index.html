<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Tracker — Personal · Work · Sleep</title>
<style>
  :root{
    --bg:#0b0d13; --card:#151824; --card2:#1b1f2e; --text:#e8ecf5; --muted:#8b94a8;
    --border:#242a3c; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --accent:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1100px 520px at 50% -12%, #1b2440 0%, rgba(11,13,19,0) 60%), var(--bg);
    background-attachment: fixed; color:var(--text); min-height:100vh;
    padding:26px 16px 70px; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:880px;margin:0 auto}

  header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:1.45rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
  .head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .live{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;background:var(--card);
    padding:9px 16px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;}

  .sync-chip{font-size:.72rem;font-weight:800;padding:8px 13px;border-radius:999px;
    border:1px solid var(--border);background:var(--card2);color:var(--muted);white-space:nowrap}
  .sync-chip.synced{color:#4ade80;border-color:#1c5c34;background:#0d2f1c}
  .sync-chip.saving{color:#fbbf24;border-color:#6b5314;background:#3a2e12}
  .sync-chip.error{color:#f87171;border-color:#6b2028;background:#3b1519}

  .sound-toggle{
    background:var(--card2);border:1px solid var(--border);border-radius:999px;
    width:38px;height:38px;font-size:1rem;cursor:pointer;color:var(--text);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .sound-toggle:hover{border-color:var(--accent)}
  .sound-toggle.off{opacity:.5}

  /* ---------- today timeline (time blocking) ---------- */
  .today-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:14px 16px 10px;margin-bottom:18px;}
  .today-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .today-head strong{font-size:.82rem;letter-spacing:.02em}
  .today-legend{display:flex;gap:12px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
  .today-legend span{display:inline-flex;align-items:center;gap:5px}
  .legend-dot{width:8px;height:8px;border-radius:50%}
  .tl-track{position:relative;height:26px;background:var(--card2);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
  .tl-block{position:absolute;top:3px;bottom:3px;border-radius:4px;opacity:.9;min-width:2px}
  .tl-block.active{opacity:1;box-shadow:0 0 10px currentColor;animation:tlPulse 1.6s ease-in-out infinite}
  @keyframes tlPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .tl-now{position:absolute;top:0;bottom:0;width:1.5px;background:#fff;opacity:.65;box-shadow:0 0 6px #fff;pointer-events:none}
  .tl-hours{display:flex;justify-content:space-between;color:#4e566b;font-size:.66rem;margin-top:6px;font-variant-numeric:tabular-nums}
  .tl-empty{color:#5d6579;font-size:.8rem;padding:4px 0 2px}

  /* ---------- tabs ---------- */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:var(--card);
    padding:7px;border-radius:18px;border:1px solid var(--border);margin-bottom:20px;
    position:sticky;top:10px;z-index:20;box-shadow:0 18px 40px -30px #000;}
  .tab{padding:13px 8px;border:0;border-radius:13px;background:transparent;color:var(--muted);
    font-size:.93rem;font-weight:700;font-family:inherit;cursor:pointer;transition:.18s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .tab:hover{color:var(--text);background:#1d2233}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 10px 26px -12px var(--accent)}
  .tab[data-tab="personal"]{--accent:#8b5cf6}
  .tab[data-tab="work"]{--accent:#14b8a6}
  .tab[data-tab="sleep"]{--accent:#f59e0b}

  .panel{display:none}
  .panel.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #panel-personal{--accent:#8b5cf6}
  #panel-work{--accent:#14b8a6}
  #panel-sleep{--accent:#f59e0b}

  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .card h2{font-size:1.02rem;letter-spacing:-.01em;margin-bottom:6px}
  .card-head h2{margin-bottom:0}
  .hint{color:var(--muted);font-size:.86rem;margin-bottom:16px}
  .hidden{display:none !important}

  .stamp{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .stamp > div{flex:1;min-width:130px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:11px 15px}
  .lbl{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:4px}
  .stamp strong{font-size:1rem;font-variant-numeric:tabular-nums;font-weight:700}

  label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:16px 0 8px;letter-spacing:.02em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{padding:9px 15px;border-radius:999px;background:var(--card2);border:1px solid var(--border);
    color:var(--text);font-size:.84rem;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .chip.selected{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 20px -12px var(--accent)}

  .text-input{width:100%;padding:13px 15px;border-radius:13px;background:var(--card2);
    border:1px solid var(--border);color:var(--text);font-size:.94rem;font-family:inherit;outline:none;transition:.15s;}
  .text-input::placeholder{color:#5d6579}
  .text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.18)}

  .btn{border:0;border-radius:13px;padding:12px 20px;font-size:.9rem;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 10px 26px -14px var(--accent)}
  .btn.warn{background:#3a2e12;color:#fbbf24;border:1px solid #6b5314}
  .btn.warn:hover{background:#4a3a15}
  .btn.danger{background:#3b1519;color:#f87171;border:1px solid #6b2028}
  .btn.danger:hover{background:#4c1a20}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn.ghost:hover{color:var(--text);border-color:#3a4258}
  .btn.big{width:100%;padding:16px;font-size:1rem;margin-top:18px}
  .btn.tiny{padding:6px 12px;font-size:.75rem;border-radius:9px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .btn-row .btn{flex:1;min-width:170px}
  .icon-btn{background:transparent;border:0;color:#4e566b;cursor:pointer;font-size:.9rem;
    padding:6px 8px;border-radius:8px;transition:.15s;font-family:inherit;}
  .icon-btn:hover{color:var(--red);background:#2a1418}
  .link{background:none;border:0;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;text-decoration:underline;padding:0}

  /* ---------- active session ---------- */
  .active-card{border-color:rgba(255,255,255,.08);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 55%), var(--card)}
  .active-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .active-head h2{font-size:1.35rem;letter-spacing:-.02em;margin:2px 0 6px}
  .meta{color:var(--muted);font-size:.82rem}
  .status{font-size:.7rem;font-weight:800;padding:7px 13px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
  .status.running{background:#0d2f1c;color:#4ade80;border:1px solid #1c5c34;animation:pulse 2.2s ease-in-out infinite}
  .status.break{background:#3a2e12;color:#fbbf24;border:1px solid #6b5314}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* ring timer */
  .timer-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 4px}
  .ring-wrap{position:relative;width:230px;height:230px;max-width:80vw;max-height:80vw}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-track{fill:none;stroke:var(--card2);stroke-width:13}
  .ring-progress{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;
    stroke-dasharray:552.92;stroke-dashoffset:552.92;
    transition:stroke-dashoffset 1s linear, stroke .3s;
    filter:drop-shadow(0 0 8px var(--accent));}
  .ring-progress.onbreak{stroke:var(--amber);filter:drop-shadow(0 0 8px var(--amber));}
  .ring-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .ring-time{font-size:clamp(1.7rem,7.5vw,2.5rem);font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.1;}
  .ring-label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    font-weight:800;margin-top:6px;}
  .ring-label b{color:var(--text)}

  .break-strip{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px 18px;margin-top:6px}
  .break-strip .lbl{margin:0}
  .break-strip b{color:var(--amber);font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;font-size:1rem}
  .break-strip .sep{width:1px;height:20px;background:var(--border)}
  .break-strip .count{font-size:.8rem;color:var(--muted);font-weight:700}

  .break-log{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .break-log-title{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .break-pills{display:flex;flex-wrap:wrap;gap:6px}
  .break-pill{font-size:.74rem;font-weight:600;background:var(--card2);border:1px solid var(--border);
    color:var(--muted);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
  .break-pill.active{color:var(--amber);border-color:#6b5314;background:#3a2e12;animation:pulse 1.6s ease-in-out infinite}

  .conflict{background:#3a2e12;border:1px solid #6b5314;color:#fbbf24;border-radius:13px;
    padding:11px 15px;font-size:.84rem;margin-bottom:16px;font-weight:600;}
  .conflict b{color:#fde68a}

  .pill{font-size:.76rem;font-weight:800;background:var(--card2);border:1px solid var(--border);
    color:var(--muted);padding:6px 13px;border-radius:999px;white-space:nowrap;}
  .sum-row{margin-bottom:14px}
  .sum-top{display:flex;justify-content:space-between;gap:10px;font-size:.87rem;margin-bottom:6px}
  .sum-name{font-weight:700}
  .sum-val{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
  .bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#ffffff55);transition:width .4s ease}
  .sum-total{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:.84rem;color:var(--muted)}
  .sum-total strong{color:var(--text);font-variant-numeric:tabular-nums}

  .day-group{margin-bottom:18px}
  .day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.76rem;
    font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    margin-bottom:9px;padding:0 2px;}
  .sess{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--border);
    border-radius:14px;padding:12px 14px;margin-bottom:8px;transition:.15s;}
  .sess:hover{border-color:#333c55}
  .sess-main{flex:1;min-width:0}
  .sess-title{font-weight:700;font-size:.92rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .sess-title .note{color:var(--muted);font-weight:500;font-size:.79rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess-sub{color:var(--muted);font-size:.76rem;margin-top:3px;font-variant-numeric:tabular-nums}
  .sess-dur{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
  .empty{color:#5d6579;font-size:.86rem;padding:14px 2px}

  .foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,26px);background:#1d2233;
    border:1px solid var(--border);color:var(--text);padding:13px 22px;border-radius:14px;
    font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:99;
    max-width:90vw;text-align:center;box-shadow:0 20px 50px -20px #000;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.good{border-color:#1c5c34;color:#86efac}
  .toast.bad{border-color:#6b2028;color:#fca5a5}

  .modal{position:fixed;inset:0;background:rgba(5,7,12,.72);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .modal.hidden{display:none}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:24px;max-width:420px;width:100%;box-shadow:0 30px 80px -30px #000;}
  .modal-box h3{font-size:1.1rem;margin-bottom:6px}
  .modal-box p{color:var(--muted);font-size:.85rem;margin-bottom:16px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span> Time Tracker</h1>
    <div class="head-right">
      <span class="sync-chip" id="syncChip">Local only</span>
      <button class="sound-toggle" id="soundToggle" title="Toggle sound">🔔</button>
      <button class="btn tiny ghost" id="authBtn">Sign in</button>
      <div class="live" id="liveClock">—</div>
    </div>
  </header>

  <!-- time-blocking view of today across all categories -->
  <div class="today-card">
    <div class="today-head">
      <strong>Today's blocks</strong>
      <div class="today-legend">
        <span><i class="legend-dot" style="background:#8b5cf6"></i>Personal</span>
        <span><i class="legend-dot" style="background:#14b8a6"></i>Work</span>
        <span><i class="legend-dot" style="background:#f59e0b"></i>Sleep</span>
      </div>
    </div>
    <div id="todayTimeline"></div>
  </div>

  <nav class="tabs">
    <button class="tab" data-tab="personal">🙂 Personal</button>
    <button class="tab" data-tab="work">💼 Work</button>
    <button class="tab" data-tab="sleep">😴 Sleep</button>
  </nav>

  <div id="panels"></div>

  <footer class="foot">
    <button class="btn ghost tiny" id="exportBtn">⬇ Export JSON</button>
    <button class="btn ghost tiny" id="wipeBtn">🗑 Reset everything</button>
  </footer>
</div>

<div class="modal hidden" id="authModal"><div class="modal-box" id="authBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   ⚙️  CLOUD CONFIG — leave placeholders for local-only
========================================================= */
const SUPABASE_URL      = 'https://ncvrciwkpklhsudwwvkz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nH6vXgwg9EtAXe6WBTNs_A_GXd8OQg4';

/* =========================================================
   CONFIG
========================================================= */
const STORAGE_KEY = 'time-tracker-v1';
const SOUND_KEY   = 'tt-sound';
const RING_C      = 2 * Math.PI * 88; /* r=88 */

const TABS = {
  personal:{ label:'Personal', presets:['Watching','Eating','Playing','Bathing','Reading','Exercise','Shopping','Gaming','Socialising','Other'] },
  work:    { label:'Work',     presets:['Deep Work','Meetings','Emails / Chat','Client Call','Learning','Admin','Other'] },
  sleep:   { label:'Sleep',    presets:['Night Sleep','Nap','Resting','Other'] }
};

const TAB_COLORS = { personal:'#8b5cf6', work:'#14b8a6', sleep:'#f59e0b' };

/* =========================================================
   SOUND (Web Audio API — no external files)
========================================================= */
let soundEnabled = localStorage.getItem(SOUND_KEY) !== 'off';
let audioCtx = null;

function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function beep(freq, dur = 0.18, vol = 0.13, when = 0){
  if(!soundEnabled) return;
  const ctx = getCtx(); if(!ctx) return;
  const t = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function chime(notes, gap = 0.11, dur = 0.18, vol = 0.13){
  notes.forEach((f, i) => beep(f, dur, vol, i * gap));
}
const SFX = {
  start:  () => chime([523.25, 659.25, 783.99], 0.09, 0.22, 0.14),
  break:  () => chime([493.88, 392.00], 0.14, 0.22, 0.11),
  resume: () => chime([440.00, 587.33, 739.99], 0.09, 0.18, 0.12),
  end:    () => chime([783.99, 659.25, 523.25], 0.15, 0.28, 0.13)
};

function updateSoundBtn(){
  const b = document.getElementById('soundToggle');
  b.textContent = soundEnabled ? '🔔' : '🔕';
  b.classList.toggle('off', !soundEnabled);
  b.title = soundEnabled ? 'Sound on — click to mute' : 'Sound off — click to unmute';
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem(SOUND_KEY, soundEnabled ? 'on' : 'off');
  updateSoundBtn();
  if(soundEnabled) beep(660, 0.12, 0.1);
  toast(soundEnabled ? 'Sound on 🔔' : 'Sound muted 🔕', 'good');
});

/* =========================================================
   STATE
========================================================= */
function defaultState(){
  return { sessions:{personal:[],work:[],sleep:[]}, active:{personal:null,work:null,sleep:null},
           currentTab:'personal', meta:{updatedAt:0} };
}
let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const d = JSON.parse(raw); const base = defaultState();
    return {
      sessions: Object.assign(base.sessions, d.sessions || {}),
      active:   Object.assign(base.active,   d.active   || {}),
      currentTab: TABS[d.currentTab] ? d.currentTab : 'personal',
      meta: { updatedAt: (d.meta && d.meta.updatedAt) || 0 }
    };
  }catch(e){ return defaultState(); }
}
function saveState(){
  state.meta = state.meta || { updatedAt: 0 };
  state.meta.updatedAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  schedulePush();
}

/* =========================================================
   CLOUD SYNC
========================================================= */
const cloudReady = SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.includes('YOUR_');
let sb = null, currentUser = null, pushTimer = null, syncing = false;
if(cloudReady){ try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ console.warn(e); } }

function setSync(kind, text){
  const el = document.getElementById('syncChip');
  el.className = 'sync-chip ' + (kind || '');
  el.textContent = text;
}
function updateAuthBtn(){
  const b = document.getElementById('authBtn');
  if(!cloudReady){ b.textContent = 'Local only'; b.disabled = true; b.style.opacity = .5; return; }
  b.textContent = currentUser ? 'Sign out' : 'Sign in';
}

function mergeStates(a, b){
  const out = defaultState();
  out.meta.updatedAt = Math.max((a&&a.meta&&a.meta.updatedAt)||0, (b&&b.meta&&b.meta.updatedAt)||0);
  Object.keys(TABS).forEach(tab => {
    const map = new Map();
    const all = [].concat((a&&a.sessions&&a.sessions[tab])||[], (b&&b.sessions&&b.sessions[tab])||[]);
    all.forEach(s => { if(s && s.id && !map.has(s.id)) map.set(s.id, s); });
    out.sessions[tab] = [...map.values()].sort((x,y) => y.startedAt - x.startedAt);
  });
  const doneIds = new Set(Object.values(out.sessions).flat().map(s => s.id));
  Object.keys(TABS).forEach(tab => {
    const x = a && a.active && a.active[tab];
    const y = b && b.active && b.active[tab];
    let pick = x && y ? (x.startedAt <= y.startedAt ? x : y) : (x || y || null);
    if(pick && doneIds.has(pick.id)) pick = null;
    out.active[tab] = pick;
  });
  out.currentTab = (b && TABS[b.currentTab] && b.currentTab) || (a && TABS[a.currentTab] && a.currentTab) || 'personal';
  return out;
}

function schedulePush(){
  if(!sb || !currentUser) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToCloud, 1200);
}
async function pushToCloud(){
  if(!sb || !currentUser || syncing) return;
  syncing = true; setSync('saving', 'Saving…');
  const { error } = await sb.from('tracker_state').upsert({
    user_id: currentUser.id, data: state, updated_at: new Date().toISOString()
  });
  syncing = false;
  setSync(error ? 'error' : 'synced', error ? 'Sync error' : 'Synced');
  if(error) console.warn('push failed', error);
}
async function pullAndMerge(){
  if(!sb || !currentUser) return;
  setSync('saving', 'Loading…');
  const { data, error } = await sb.from('tracker_state').select('data').eq('user_id', currentUser.id).maybeSingle();
  if(error){ setSync('error','Sync error'); console.warn(error); return; }
  if(!data || !data.data || !data.data.sessions){ await pushToCloud(); return; }
  state = mergeStates(state, data.data);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  renderAll(); renderTodayTimeline(); switchTab(state.currentTab || 'personal');
  await pushToCloud();
}

function openAuthModal(){

         Leave the placeholders to keep using this app offline in this browser.</p>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-close-modal>Close</button>`;
    document.getElementById('authModal').classList.remove('hidden'); return;
  }
  if(currentUser){
    box.innerHTML = `<h3>Signed in</h3>
      <p>${escapeHtml(currentUser.email || 'your account')}<br>Your data syncs across every device using this account.</p>
      <button class="btn danger" style="width:100%;margin-top:8px" id="signOutBtn">Sign out</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-close-modal>Close</button>`;
  }else{

      <p>Enter your email and I'll send you a magic link. Use the same email on every device.</p>
      <input type="email" class="text-input" id="authEmail" placeholder="you@example.com" autocomplete="email"/>
      <button class="btn primary" style="width:100%;margin-top:12px" id="sendLinkBtn">Send magic link</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-close-modal>Cancel</button>`;
    setTimeout(() => document.getElementById('authEmail')?.focus(), 60);
  }
  document.getElementById('authModal').classList.remove('hidden');

document.getElementById('authModal').addEventListener('click', async (e) => {
  if(e.target.id === 'authModal' || e.target.closest('[data-close-modal]'))
    document.getElementById('authModal').classList.add('hidden');
  if(e.target.id === 'sendLinkBtn'){
    const email = (document.getElementById('authEmail').value || '').trim();
    if(!email || !email.includes('@')){ toast('Enter a valid email.', 'bad'); return; }
    e.target.disabled = true; e.target.textContent = 'Sending…';

      options:{ emailRedirectTo: window.location.origin + window.location.pathname }});
    if(error){ toast(error.message, 'bad'); e.target.disabled = false; e.target.textContent = 'Send magic link'; }
    else{
      document.getElementById('authBox').innerHTML = `<h3>Check your email 📬</h3>
        <p>Sign-in link sent to <b>${escapeHtml(email)}</b>. Click it to finish signing in.</p>
        <button class="btn ghost" style="width:100%;margin-top:8px" data-close-modal>Close</button>`;
    }
  }

    document.getElementById('authModal').classList.add('hidden');
    toast('Signed out.', 'good'); }
});
document.getElementById('authBtn').addEventListener('click', openAuthModal);

async function initCloud(){
  if(!sb){ updateAuthBtn(); setSync('', 'Local only'); return; }
  const { data } = await sb.auth.getSession();
  currentUser = data?.session?.user || null;
  updateAuthBtn();
  if(currentUser) await pullAndMerge();
  else setSync('', 'Local only');
  sb.auth.onAuthStateChange(async (_ev, session) => {
    const was = currentUser;
    currentUser = session?.user || null;
    updateAuthBtn();
    if(currentUser && (!was || was.id !== currentUser.id)) await pullAndMerge();
    if(!currentUser) setSync('', 'Local only');
  });
}

/* =========================================================
   HELPERS
========================================================= */
function fmtClock(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return [Math.floor(t/3600), Math.floor((t%3600)/60), t%60]
    .map(n => String(n).padStart(2,'0')).join(':');
}
function fmtHuman(ms){
  const t = Math.floor(Math.max(0,ms)/1000);
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  if(h) return `${h}h ${m}m`;
  if(m) return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function fmtDateLong(ts){ return new Date(ts).toLocaleDateString([], {weekday:'short',day:'2-digit',month:'short',year:'numeric'}); }
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* active session math */
function sumDoneBreaks(s){ return s.breaks.reduce((a,b) => a + (b.end - b.start), 0); }
function activeElapsedMs(s, now = Date.now()){
  return (now - s.startedAt) - sumDoneBreaks(s) - (s.breakStart ? (now - s.breakStart) : 0);
}
function breakElapsedMs(s, now = Date.now()){
  return sumDoneBreaks(s) + (s.breakStart ? (now - s.breakStart) : 0);
}

function toast(msg, kind = 'good'){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show ' + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; }, 2800);
}

/* =========================================================
   RENDER
========================================================= */
function renderTab(tab){
  const s = state.active[tab];
  const startCard  = document.getElementById('startCard-'  + tab);
  const activeCard = document.getElementById('activeCard-' + tab);

  if(s){ startCard.classList.add('hidden'); activeCard.classList.remove('hidden'); renderActive(tab); }
  else { startCard.classList.remove('hidden'); activeCard.classList.add('hidden'); }

  const conflictEl = document.getElementById('conflict-' + tab);
  const other = Object.keys(state.active).find(t => t !== tab && state.active[t]);
  conflictEl.innerHTML = (!s && other)
    ? `<div class="conflict">⚠ A session is already running in <b>${TABS[other].label}</b>.
         <button class="link" data-goto="${other}">Go there →</button></div>` : '';

  renderSummary(tab); renderHistory(tab); updateStamp(tab);
}
function renderAll(){ Object.keys(TABS).forEach(renderTab); }

function renderActive(tab){
  const s = state.active[tab]; if(!s) return;
  const onBreak = !!s.breakStart;

  document.getElementById('activeActivity-' + tab).textContent = s.activity;
  document.getElementById('activeMeta-' + tab).textContent =
    `Started ${fmtDateLong(s.startedAt)} at ${fmtTime(s.startedAt)}` + (s.notes ? ` · ${s.notes}` : '');

  const status = document.getElementById('status-' + tab);
  status.textContent = onBreak ? 'On break' : 'Running';
  status.className = 'status ' + (onBreak ? 'break' : 'running');

  document.getElementById('activeBtns-' + tab).innerHTML = onBreak
    ? `<button class="btn primary" data-act="resume" data-tab="${tab}">▶ Resume session</button>
       <button class="btn danger"  data-act="end"    data-tab="${tab}">⏹ Logout / End session</button>`
    : `<button class="btn warn"    data-act="break"  data-tab="${tab}">⏸ Take a break</button>
       <button class="btn danger"  data-act="end"    data-tab="${tab}">⏹ Logout / End session</button>`;

  renderBreakLog(tab, s);
  tick();
}

function renderBreakLog(tab, s){
  const el = document.getElementById('breakLog-' + tab);
  if(!el) return;
  const done = s.breaks;
  if(!done.length && !s.breakStart){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');

  const pills = done.slice(-5).map(b =>
    `<span class="break-pill">${fmtTime(b.start)} – ${fmtTime(b.end)} · ${fmtHuman(b.end - b.start)}</span>`
  ).join('');
  const activePill = s.breakStart
    ? `<span class="break-pill active">on break since ${fmtTime(s.breakStart)}</span>` : '';

  el.innerHTML = `<div class="break-log-title">Breaks this session</div>
                  <div class="break-pills">${pills}${activePill}</div>`;
}

function renderSummary(tab){
  const wrap = document.getElementById('summary-' + tab);
  const list = state.sessions[tab];
  const totals = {}; let grand = 0, today = 0;
  const todayKey = new Date().toDateString();
  list.forEach(s => {
    totals[s.activity] = (totals[s.activity] || 0) + s.activeMs;
    grand += s.activeMs;
    if(new Date(s.startedAt).toDateString() === todayKey) today += s.activeMs;
  });
  document.getElementById('totalPill-' + tab).textContent = 'Today · ' + fmtHuman(today);
  const entries = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  if(!entries.length){ wrap.innerHTML = '<p class="empty">Nothing tracked yet — start a session above 👆</p>'; return; }
  const max = entries[0][1];
  wrap.innerHTML = entries.map(([name, ms]) => `
    <div class="sum-row">
      <div class="sum-top"><span class="sum-name">${escapeHtml(name)}</span><span class="sum-val">${fmtHuman(ms)}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${Math.max(3,(ms/max)*100)}%"></div></div>
    </div>`).join('') +
    `<div class="sum-total">Total ${TABS[tab].label.toLowerCase()} time tracked: <strong>${fmtHuman(grand)}</strong></div>`;
}

function renderHistory(tab){
  const wrap = document.getElementById('history-' + tab);
  const list = state.sessions[tab];
  if(!list.length){ wrap.innerHTML = '<p class="empty">No sessions yet.</p>'; return; }
  const groups = new Map();
  list.forEach(s => {
    const key = new Date(s.startedAt).toDateString();
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });
  let html = '';
  for(const [, items] of groups){
    const dayTotal = items.reduce((a,s) => a + s.activeMs, 0);
    html += `<div class="day-group">
      <div class="day-head"><span>${fmtDateLong(items[0].startedAt)}</span><span class="pill">${fmtHuman(dayTotal)}</span></div>`;
    items.forEach(s => {
      html += `<div class="sess">
        <div class="sess-main">
          <div class="sess-title">${escapeHtml(s.activity)}${s.notes ? `<span class="note">· ${escapeHtml(s.notes)}</span>` : ''}</div>
          <div class="sess-sub">${fmtTime(s.startedAt)} → ${fmtTime(s.endedAt)}${s.breakMs > 1000 ? ` · break ${fmtHuman(s.breakMs)}` : ''}</div>
        </div>
        <div class="sess-dur">${fmtHuman(s.activeMs)}</div>
        <button class="icon-btn" data-del="${tab}" data-id="${s.id}" title="Delete session">✕</button>
      </div>`;
    });
    html += `</div>`;
  }
  wrap.innerHTML = html;
}

function updateStamp(tab){
  const now = new Date();
  const d = document.getElementById('stampDate-' + tab);
  const t = document.getElementById('stampTime-' + tab);
  if(d) d.textContent = now.toLocaleDateString([], {weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  if(t) t.textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* =========================================================
   TODAY'S TIMELINE (time blocking view)
========================================================= */
function renderTodayTimeline(){
  const wrap = document.getElementById('todayTimeline');
  const dayStart = new Date(); dayStart.setHours(0,0,0,0);
  const dayStartMs = dayStart.getTime();
  const dayMs = 86400000;
  const now = Date.now();

  const blocks = [];
  Object.keys(TABS).forEach(tab => {
    state.sessions[tab].forEach(s => {
      if(s.endedAt < dayStartMs || s.startedAt > dayStartMs + dayMs) return;
      const start = Math.max(s.startedAt, dayStartMs);
      const end   = Math.min(s.endedAt,   dayStartMs + dayMs);
      blocks.push({
        left: ((start - dayStartMs) / dayMs) * 100,
        width: Math.max(0.25, ((end - start) / dayMs) * 100),
        color: TAB_COLORS[tab],
        title: `${TABS[tab].label}: ${s.activity} · ${fmtTime(start)}–${fmtTime(end)}`,
        active: false
      });
    });
    const a = state.active[tab];
    if(a && a.startedAt >= dayStartMs){
      const start = Math.max(a.startedAt, dayStartMs);
      blocks.push({
        left: ((start - dayStartMs) / dayMs) * 100,
        width: Math.max(0.25, ((now - start) / dayMs) * 100),
        color: TAB_COLORS[tab],
        title: `${TABS[tab].label}: ${a.activity} (running)`,
        active: true
      });
    }
  });

  const nowPct = ((now - dayStartMs) / dayMs) * 100;

  if(!blocks.length){
    wrap.innerHTML = `<div class="tl-empty">No blocks yet today — start a session to see it here.</div>
      <div class="tl-hours"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="tl-track">
      ${blocks.map(b => `<div class="tl-block${b.active?' active':''}"
        style="left:${b.left}%;width:${b.width}%;background:${b.color};color:${b.color}"
        title="${escapeHtml(b.title)}"></div>`).join('')}
      <div class="tl-now" style="left:${nowPct}%"></div>
    </div>
    <div class="tl-hours"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>`;
}

/* =========================================================
   TICK
========================================================= */
function tick(){
  const now = new Date();
  document.getElementById('liveClock').textContent =
    now.toLocaleDateString([], {weekday:'short',day:'2-digit',month:'short'}) + ' · ' +
    now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

  Object.keys(TABS).forEach(tab => {
    updateStamp(tab);
    const s = state.active[tab]; if(!s) return;
    const onBreak = !!s.breakStart;
    const aMs = activeElapsedMs(s);

    /* ring timer */
    const tEl = document.getElementById('timer-' + tab);
    if(tEl) tEl.textContent = fmtClock(aMs);

    const hourN = Math.floor(aMs / 3600000) + 1;
    const hourEl = document.getElementById('ringHour-' + tab);
    if(hourEl && hourEl.textContent !== String(hourN)) hourEl.textContent = hourN;

    const ring = document.getElementById('ringProgress-' + tab);
    if(ring){
      const pct = (aMs % 3600000) / 3600000;
      ring.style.strokeDashoffset = RING_C * (1 - pct);
      ring.classList.toggle('onbreak', onBreak);
    }

    /* break timer */
    const bEl = document.getElementById('breakTimer-' + tab);
    if(bEl) bEl.textContent = fmtClock(breakElapsedMs(s));

    const cEl = document.getElementById('breakCount-' + tab);
    if(cEl){
      const n = s.breaks.length + (s.breakStart ? 1 : 0);
      const txt = n === 0 ? 'no breaks yet' : n === 1 ? '1 break' : `${n} breaks`;
      if(cEl.textContent !== txt) cEl.textContent = txt;
    }

    const status = document.getElementById('status-' + tab);
    if(status){
      const txt = onBreak ? 'On break' : 'Running';
      const cls = 'status ' + (onBreak ? 'break' : 'running');
      if(status.textContent !== txt) status.textContent = txt;
      if(status.className !== cls) status.className = cls;
    }

    /* refresh break log pill clock while on break */
    if(onBreak) renderBreakLog(tab, s);
  });

  renderTodayTimeline();
}

/* =========================================================
   ACTIONS
========================================================= */
function switchTab(tab){
  if(!TABS[tab]) return;
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  updateStamp(tab); saveState();
}

function startSession(tab){
  const runningTab = Object.keys(state.active).find(t => state.active[t]);
  if(runningTab){
    toast(`A session is already running in ${TABS[runningTab].label}. End it first.`, 'bad');
    switchTab(runningTab); return;
  }
  const input = document.getElementById('activity-' + tab);
  const activity = (input.value || '').trim();
  if(!activity){ input.focus(); toast('Pick or type what you are doing first.', 'bad'); return; }

  state.active[tab] = {
    id:'s' + Date.now() + Math.random().toString(36).slice(2,7),
    activity,
    notes:(document.getElementById('notes-' + tab).value || '').trim(),
    startedAt: Date.now(),
    breaks:[], breakStart:null
  };
  input.value = '';
  document.getElementById('notes-' + tab).value = '';
  document.querySelectorAll(`#chips-${tab} .chip`).forEach(c => c.classList.remove('selected'));

  saveState(); renderAll(); renderTodayTimeline();
  SFX.start();
  toast(`${TABS[tab].label} session started — “${activity}”`, 'good');
}

function handleAct(act, tab){
  const s = state.active[tab]; if(!s) return;

  if(act === 'break'){
    if(s.breakStart){ toast('Already on a break.', 'bad'); return; }
    s.breakStart = Date.now();
    SFX.break();
    toast('Break started ☕ Break timer running.', 'good');
    saveState(); renderActive(tab); return;
  }

  if(act === 'resume'){
    if(!s.breakStart){ toast('Not on a break.', 'bad'); return; }
    const end = Date.now();
    s.breaks.push({ start: s.breakStart, end });
    s.breakStart = null;
    SFX.resume();
    toast(`Break ended · ${fmtHuman(end - s.breaks[s.breaks.length-1].start)} added. Session resumed ▶`, 'good');
    saveState(); renderActive(tab); return;
  }

  if(act === 'end'){ endSession(tab); return; }
}

function endSession(tab){
  const s = state.active[tab]; if(!s) return;
  const end = Date.now();
  if(s.breakStart){ s.breaks.push({ start:s.breakStart, end }); s.breakStart = null; }

  const breakMs = sumDoneBreaks(s);
  const totalMs = end - s.startedAt;
  const activeMs = Math.max(0, totalMs - breakMs);

  state.sessions[tab].unshift({
    id:s.id, activity:s.activity, notes:s.notes,
    startedAt:s.startedAt, endedAt:end, breaks:s.breaks,
    totalMs, breakMs, activeMs
  });
  state.active[tab] = null;
  saveState(); renderAll(); renderTodayTimeline();
  SFX.end();
  toast(`Logged: ${s.activity} · ${fmtHuman(activeMs)} active${breakMs > 1000 ? ` · ${fmtHuman(breakMs)} break` : ''}`, 'good');
}

function deleteSession(tab, id){
  state.sessions[tab] = state.sessions[tab].filter(s => s.id !== id);
  saveState(); renderTab(tab); renderTodayTimeline();
  toast('Session deleted.', 'good');
}

function clearTab(tab){
  if(!state.sessions[tab].length){ toast('Nothing to clear.', 'bad'); return; }
  if(!confirm(`Delete ALL ${TABS[tab].label.toLowerCase()} sessions? This cannot be undone.`)) return;
  state.sessions[tab] = [];
  saveState(); renderTab(tab); renderTodayTimeline();
  toast('All sessions cleared.', 'good');
}

/* =========================================================
   EVENTS
========================================================= */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('panels').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if(!btn) return;
  if(btn.dataset.chip){
    const tab = btn.dataset.chip;
    document.querySelectorAll(`#chips-${tab} .chip`).forEach(c => c.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('activity-' + tab).value = btn.dataset.val;
    return;
  }
  if(btn.dataset.start){ startSession(btn.dataset.start); return; }
  if(btn.dataset.act){ handleAct(btn.dataset.act, btn.dataset.tab); return; }
  if(btn.dataset.del){ deleteSession(btn.dataset.del, btn.dataset.id); return; }
  if(btn.dataset.clear){ clearTab(btn.dataset.clear); return; }
  if(btn.dataset.goto){ switchTab(btn.dataset.goto); return; }
});

Object.keys(TABS).forEach(tab => {
  document.getElementById('activity-' + tab).addEventListener('input', () => {
    document.querySelectorAll(`#chips-${tab} .chip`).forEach(c => c.classList.remove('selected'));
  });
  document.getElementById('activity-' + tab).addEventListener('keydown', e => {
    if(e.key === 'Enter') startSession(tab);
  });
  document.getElementById('notes-' + tab).addEventListener('keydown', e => {
    if(e.key === 'Enter') startSession(tab);
  });
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `time-tracker-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Data exported.', 'good');
});

document.getElementById('wipeBtn').addEventListener('click', () => {
  if(!confirm('Erase ALL data locally (and in the cloud on next sync)?')) return;
  state = defaultState(); localStorage.removeItem(STORAGE_KEY);
  renderAll(); renderTodayTimeline(); switchTab('personal'); saveState();
  toast('Everything reset.', 'good');
});

/* =========================================================
   BOOT
========================================================= */
updateSoundBtn();
renderAll();
renderTodayTimeline();
switchTab(state.currentTab || 'personal');
tick();
setInterval(tick, 1000);
initCloud();

window.addEventListener('storage', (e) => {
  if(e.key !== STORAGE_KEY || !e.newValue) return;
  try{
    const incoming = JSON.parse(e.newValue);
    if((incoming.meta?.updatedAt || 0) > (state.meta?.updatedAt || 0)){
      state = loadState(); renderAll(); renderTodayTimeline(); switchTab(state.currentTab || 'personal');
    }
  }catch(_){}
});
</script>
</body>
</html>
